name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - 'jarvis/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    # 22.04: buildozer's apt dependency list still resolves here (libncurses5-dev
    # and libtinfo5 were dropped from 24.04, which breaks its auto-install).
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17 (required by python-for-android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies (non-interactive, never hangs)
        run: |
          sudo -E env DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo -E env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Cache buildozer build dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
          if-no-files-found: error
